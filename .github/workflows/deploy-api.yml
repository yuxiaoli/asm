name: Deploy Registry Worker
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      [
        "src/api/**",
        "scripts/deploy-api.ts",
        "scripts/minisearch-options.ts",
        "website-src/src/lib/filter-sort.js",
        "website-src/src/lib/utils.js",
        "wrangler.jsonc",
        "package.json",
        "package-lock.json",
        ".github/workflows/deploy-api.yml",
      ]
permissions:
  contents: read
  pages: read
concurrency:
  group: registry-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.ASM_WORKER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api && npm run typecheck
      - run: npm run deploy:api
